# On every push and pull request: the tests. Those that need the pinned source files skip
# themselves when the files are absent; the type, writer, mapping and loader tests always run.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q -rs
