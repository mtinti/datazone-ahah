# Column definitions by edition, with where each comes from (docs/AHAH_Provenance_Site_Plan.md,
# section 3). An entry lists definitions, each with the editions it applies to, the text, the
# unit, and a reference: a quotation from a document in documents.yaml (kind: quotation), a
# paraphrase of one (kind: paraphrase), a reviewed correction beside a quotation (kind:
# correction), or our own wording (kind: ours), with the decision id where one applies. The
# schema descriptions stay the short form; these are the fuller, attributed ones.
version: 1
columns:
  ahah_version:
  - editions:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5.1'
    kind: ours
    text: 'The AHAH edition the row belongs to: 1, 2, 3, 4 or 5.1. Editions are not comparable with each other.'
    unit: null
    reference:
      kind: ours
      decision: one-table-all-editions
  datazone_vintage:
  - editions:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5.1'
    kind: ours
    text: 'The Scottish data zone vintage the edition is on: 2011 for editions 1 to 4, 2022 for 5.1. The vintages
      do not nest.'
    unit: null
    reference:
      kind: ours
      decision: datazone-lists
  datazone_code:
  - editions:
    - '1'
    - '2'
    - '3'
    - '4'
    kind: ours
    text: Scottish data zone code (S01...) of the 2011 vintage, read from the edition's code column.
    unit: null
    reference:
      kind: ours
      decision: datazone-lists
  - editions:
    - '5.1'
    kind: quotation
    text: Lower Super Output Area Code (2011) / Data Zones (Scotland)
    unit: null
    reference:
      document: v5_dictionary
      location: row lsoa21cd
  - editions:
    - '5.1'
    kind: correction
    unit: null
    reference:
      document: v5_methodology
      location: section 2.2
    text: 'The dictionary''s "(2011)" is wrong for Scotland: the methodology report, section 2.2, says 2022 data
      zones, and the file holds 7,392 codes, the 2022 count.'
