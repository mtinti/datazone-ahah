  - editions:
    - '1'
    kind: paraphrase
    text: Network distance (kilometres) to the nearest GP practice, by road from the area's postcodes.
    unit: kilometres
    reference:
      document: daras2019
      location: Methods, accessibility indicators
  - &id001
