# Pinned sources for the AHAH build. Version 1, 29 October 2026.
#
# A pin is never updated by the pipeline: changed bytes stop it. Each edition names the file the
# build reads, its SHA256, the row count the publisher's data summary states for Great Britain,
# and the Scottish data zone vintage the edition is on. The paths are relative to data/sources.
version: 1

licence: "UK Open Government Licence v3.0, access tier Open on GeoDS; registration required to download"
attribution:
  - "Daras K, Green MA, Davies A, Barr B, Singleton A (2019). Open data on health-related neighbourhood features in Great Britain. Scientific Data 6, 107. doi:10.1038/s41597-019-0114-6"
  - "Data provided by the Geographic Data Service, a Smart Data Research UK investment, ES/Z504464/1"
  - "Contains Scottish Government data zone lists, licensed under the Open Government Licence v3.0"

publisher_pages:
  geods: https://data.geods.ac.uk/dataset/access-to-healthy-assets-hazards-ahah
  geods_previous: https://data.geods.ac.uk/dataset/access-to-healthy-assets-hazards-ahah-previous-versions
  code: https://github.com/GeographicDataService/ahah

# The editions, in table order. `gb_rows` is the count the publisher's data summary states.
# `scottish_rows` is the number of data zones of the vintage, which the reference list confirms.
editions:
